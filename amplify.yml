# Build spec for dertwerk-backend: the Amplify Gen 2 backend that owns the
# Cognito user pool EVERY dertwerk app signs in against, plus the data,
# storage and function resources.
#
# 🚨 The `frontend:` block below is not optional, even though this repo has no
# frontend. This Amplify app is platform WEB, and Amplify Hosting rejects a
# buildspec without a frontend definition:
#
#     !!! CustomerError: Missing frontend definition in buildspec
#
# That is exactly what happened on 2026-03-05: the commit that stripped the
# React app out of this repo deleted the frontend block along with it, and
# every backend deploy since then has failed at checkout, before running a
# single command. Nothing looked wrong -- the already-deployed pool, data and
# storage carried on serving all six apps perfectly -- so the broken pipeline
# went unnoticed for six months. If this repo ever needs a real frontend
# again, replace the placeholder; do not delete the block.
version: 1
backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        # A deliberate placeholder. Amplify needs an artifact directory that
        # exists and is non-empty; this app has no custom domain attached, so
        # the only thing that serves is d18viqqj17hn5f.amplifyapp.com, which
        # nothing links to. The page exists to explain itself to whoever finds
        # it, not to be used.
        - mkdir -p dist
        - echo '<!doctype html><meta charset="utf-8"><title>dertwerk-backend</title><p>This Amplify app hosts the shared DertWerk backend (Cognito, data, storage). It has no frontend by design.' > dist/index.html
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - .npm/**/*
